<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hacienda y Seguridad Social · ARA-OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#f2f6f7; --surface:#ffffff; --surface-2:#e9f0f2; --line:#d2dfe3; --line-soft:#e3ecee;
  --ink:#0d1c21; --ink-2:#3d5860; --ink-3:#6c868e; --accent:#0b6e7a; --accent-soft:#d3e9ec;
  --good:#1a6b45; --good-soft:#d6ebe0; --warn:#8a5300; --warn-soft:#f6e6cd; --crit:#a52a1c; --crit-soft:#f7dfda;
  --shadow:0 1px 2px rgba(13,28,33,.06), 0 8px 24px -18px rgba(13,28,33,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0a1216; --surface:#111e23; --surface-2:#16262c; --line:#24393f; --line-soft:#1c2f35;
    --ink:#e7f0f2; --ink-2:#a7bfc6; --ink-3:#7b959d; --accent:#4cb6c2; --accent-soft:#123840;
    --good:#6fd3a2; --good-soft:#0f3326; --warn:#e0aa5c; --warn-soft:#3a2a10; --crit:#f0897a; --crit-soft:#3d1a15;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --ground:#0a1216; --surface:#111e23; --surface-2:#16262c; --line:#24393f; --line-soft:#1c2f35;
  --ink:#e7f0f2; --ink-2:#a7bfc6; --ink-3:#7b959d; --accent:#4cb6c2; --accent-soft:#123840;
  --good:#6fd3a2; --good-soft:#0f3326; --warn:#e0aa5c; --warn-soft:#3a2a10; --crit:#f0897a; --crit-soft:#3d1a15;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:30px 20px 80px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
h1{font-family:"Archivo",sans-serif;font-weight:700;font-size:clamp(26px,4vw,36px);letter-spacing:-.02em;line-height:1.1;margin:0 0 10px}
h2{font-family:"Archivo",sans-serif;font-weight:600;font-size:18px;letter-spacing:-.01em;margin:34px 0 10px}
.sub{color:var(--ink-2);max-width:74ch;margin:0}
.controls{display:flex;gap:8px;align-items:center;margin:16px 0 0;flex-wrap:wrap}
button{font:inherit;font-size:14px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:24px 0 6px}
.kpi{background:var(--surface);padding:16px 18px}
.kpi .k{font-size:12px;color:var(--ink-3);margin-bottom:5px}
.kpi .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:24px;font-weight:600;letter-spacing:-.02em}
.kpi .n{font-size:12px;color:var(--ink-3);margin-top:3px}
.pos{color:var(--good)} .neg{color:var(--crit)} .muted{color:var(--ink-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.card .hd{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.card .hd h3{font-family:"Archivo",sans-serif;font-size:15px;margin:0 0 3px;font-weight:600}
.card .hd .ref{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3)}
.card .nota{padding:10px 16px;font-size:13px;color:var(--ink-2);background:var(--surface-2);border-bottom:1px solid var(--line)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:right;font-weight:600;color:var(--ink-3);font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
th:first-child,td:first-child{text-align:left}
td{padding:8px 10px;border-bottom:1px solid var(--line-soft);text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
td:first-child{font-family:inherit}
tfoot td{font-weight:600;border-top:1px solid var(--line);border-bottom:0;background:var(--surface-2)}
.tag{display:inline-block;font-family:"Source Sans 3",sans-serif;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.t-pagado{background:var(--good-soft);color:var(--good)}
.t-pendiente{background:var(--accent-soft);color:var(--accent)}
.t-sin_confirmar{background:var(--warn-soft);color:var(--warn)}
.t-impagado,.t-ejecutivo{background:var(--crit-soft);color:var(--crit)}
.aviso{border-radius:10px;padding:12px 15px;margin-bottom:9px;font-size:14px;border:1px solid}
.a-rojo{background:var(--crit-soft);border-color:var(--crit);color:var(--crit)}
.a-ambar{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.metodo{margin-top:32px;padding:14px 16px;border:1px dashed var(--line);border-radius:10px;font-size:13px;color:var(--ink-2)}
.err{background:var(--crit-soft);color:var(--crit);padding:14px 16px;border-radius:10px}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">ARA·OS · Obligaciones</p>
  <h1>Hacienda y Seguridad Social</h1>
  <p class="sub">Qué se debe, qué plazo viene y si el cargo ha entrado de verdad en el banco. El calendario sale de los acuerdos originales y de la relación de deudas de la sede; el cruce, de la contabilidad de Holded.</p>
  <div class="controls">
    <button id="recargar">Actualizar</button>
    <span class="muted" id="sello"></span>
  </div>
  <div id="app"><p class="muted" style="margin-top:28px">Cargando…</p></div>
</div>

<script>
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const eur = n => (Number(n)||0).toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2}) + " €";
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fecha = f => /^\d{4}-\d{2}-\d{2}$/.test(f) ? f.slice(8,10)+"/"+f.slice(5,7)+"/"+f.slice(0,4) : esc(f);
const ETIQ = {pagado:"pagado", pendiente:"pendiente", sin_confirmar:"sin confirmar", impagado:"impagado"};

function kpis(d){
  const c = d.resumen.caja;
  const apuros = c != null && d.resumen.comprometido_30d > c;
  return `<div class="kpis">
    <div class="kpi"><div class="k">Deuda total pendiente</div><div class="v">${eur(d.resumen.deuda_total)}</div><div class="n">AEAT y organismos, todas las sociedades</div></div>
    <div class="kpi"><div class="k">Comprometido 30 días</div><div class="v">${eur(d.resumen.comprometido_30d)}</div><div class="n">plazos + cuota estimada de TGSS</div></div>
    <div class="kpi"><div class="k">Caja disponible</div><div class="v ${apuros?"neg":""}">${c==null?"—":eur(c)}</div><div class="n">${apuros?"no cubre los 30 días":"según tesorería de Holded"}</div></div>
  </div>`;
}

function avisos(d){
  if(!d.avisos.length) return "";
  return `<div style="margin:26px 0 4px">` + d.avisos.map(a =>
    `<div class="aviso a-${esc(a.nivel)}">${esc(a.texto)}</div>`).join("") + `</div>`;
}

function proximos(d){
  if(!d.proximos.length) return "";
  return `<h2>Lo que viene en 30 días</h2><div class="card"><div class="tw"><table>
    <thead><tr><th>Fecha</th><th>Concepto</th><th>Sociedad</th><th>Cuenta</th><th>Importe</th></tr></thead>
    <tbody>${d.proximos.map(p=>`<tr>
      <td style="font-family:'IBM Plex Mono',monospace">${fecha(p.fecha)}</td>
      <td>${esc(p.que)}</td><td>${esc(p.quien)}</td>
      <td style="font-family:'IBM Plex Mono',monospace;font-size:12px">${esc(p.cuenta)}</td>
      <td>${eur(p.importe)}${p.estimado?' <span class="muted">est.</span>':""}</td></tr>`).join("")}</tbody>
    <tfoot><tr><td colspan="4">Total</td><td>${eur(d.resumen.comprometido_30d)}</td></tr></tfoot>
  </table></div></div>`;
}

function expediente(e){
  const cab = `<div class="hd"><div>
      <h3>${esc(e.concepto)}</h3>
      <div class="ref">${esc(e.sociedad)} · ${esc(e.referencia)} · ${esc(e.cuenta)}</div>
    </div><div style="text-align:right">
      <div class="v" style="font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600">${eur(e.pendiente)}</div>
      <div class="ref">pendiente${e.total!==e.pendiente?" de "+eur(e.total):""}</div>
    </div></div>`;
  const nota = e.notas ? `<div class="nota">${esc(e.notas)}</div>` : "";
  if(!e.plazos.length){
    return `<div class="card">${cab}${nota}<div style="padding:12px 16px">
      <span class="tag t-${e.tipo==="ejecutivo"?"ejecutivo":"sin_confirmar"}">${e.tipo==="ejecutivo"?"en periodo ejecutivo":"sin calendario de plazos"}</span>
    </div></div>`;
  }
  const filas = e.plazos.map(p=>`<tr>
      <td style="font-family:'IBM Plex Mono',monospace">${fecha(p.fecha)}</td>
      <td style="text-align:left"><span class="tag t-${esc(p.estado)}">${ETIQ[p.estado]||p.estado}</span></td>
      <td style="text-align:left;font-size:12px;color:var(--ink-3);font-family:'IBM Plex Mono',monospace">${p.cargo?esc(p.cargo.descripcion):""}</td>
      <td>${eur(p.importe)}</td></tr>`).join("");
  return `<div class="card">${cab}${nota}<div class="tw"><table>
    <thead><tr><th>Vencimiento</th><th style="text-align:left">Estado</th><th style="text-align:left">Cargo en banco</th><th>Importe</th></tr></thead>
    <tbody>${filas}</tbody>
    <tfoot><tr><td colspan="3">Pagado ${eur(e.pagado)} · pendiente</td><td>${eur(e.pendiente)}</td></tr></tfoot>
  </table></div></div>`;
}

function periodicos(d){
  if(!d.periodicos || !d.periodicos.length) return "";
  return `<h2>Impuestos del trimestre</h2><div class="card">
  <div class="nota"><strong>El trimestre en curso está abierto:</strong> estas cifras son las de hoy y subirán con lo que quede por facturar y por meter (facturas de 2025 sin presentar, gastos del año aún sin registrar). No son la autoliquidación. El devengo sale del haber de las cuentas de Hacienda en el trimestre en curso. El saldo es <strong>sólo del año en curso</strong> (positivo = queda a deber; negativo = se ha pagado más de lo devengado en el año, normalmente porque el pago arrastraba el ejercicio anterior). No es el saldo histórico de la cuenta.</div>
  <div class="tw"><table><thead><tr>
    <th>Modelo</th><th style="text-align:left">Concepto</th><th>Periodo</th><th>Presentar antes de</th><th>Devengado</th><th>Saldo del año</th><th>Acumulado sin pagar</th>
  </tr></thead><tbody>${
    d.periodicos.map(p=>`<tr>
      <td>${esc(p.modelo)}</td>
      <td style="text-align:left">${esc(p.concepto)}</td>
      <td style="font-family:'IBM Plex Mono',monospace">${esc(p.periodo)}</td>
      <td style="font-family:'IBM Plex Mono',monospace">${fecha(p.vencimiento)}</td>
      <td>${eur(p.devengado_trimestre)}${p.repercutido_trimestre!=null?`<div class="muted" style="font-size:11px">${eur(p.repercutido_trimestre)} − ${eur(p.soportado_trimestre)}</div>`:""}</td>
      <td class="${p.saldo_cuenta<-1?"muted":""}">${eur(p.saldo_cuenta)}</td>
      <td class="${(p.acumulado_sin_pagar||p.arrastre)>100?"neg":"muted"}">${eur(p.acumulado_sin_pagar!=null?p.acumulado_sin_pagar:p.arrastre)}</td></tr>`).join("")
  }</tbody></table></div>
  ${d.periodicos.filter(p=>p.notas).map(p=>`<div class="nota"><strong>Modelo ${esc(p.modelo)}.</strong> ${esc(p.notas)}</div>`).join("")}
  </div>`;
}

function recurrentes(d){
  if(!d.recurrentes.length) return "";
  return `<h2>Pagos recurrentes</h2>` + d.recurrentes.map(r=>`<div class="card">
    <div class="hd"><div><h3>${esc(r.concepto)}</h3>
      <div class="ref">${esc(r.sociedad)} · ${esc(r.cuenta)} · ${esc(r.dia)}</div></div>
      <div style="text-align:right"><div style="font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600">${r.media_3m==null?"—":eur(r.media_3m)}</div>
      <div class="ref">media de los 3 últimos</div></div></div>
    ${r.notas?`<div class="nota">${esc(r.notas)}</div>`:""}
    ${r.ultimos.length?`<div class="tw"><table><thead><tr><th>Fecha</th><th>Importe</th></tr></thead><tbody>${
      r.ultimos.map(u=>`<tr><td style="font-family:'IBM Plex Mono',monospace">${fecha(u.fecha)}</td><td>${eur(u.importe)}</td></tr>`).join("")
    }</tbody></table></div>`:""}
  </div>`).join("");
}

function embargos(d){
  if(!d.embargos || !d.embargos.length) return "";
  return `<h2>Diligencias de embargo cobradas</h2>
  <div class="card"><div class="nota">Estos importes salieron de la cuenta por embargo, no por domiciliación. La diligencia sigue viva mientras haya deuda en ejecutivo y vuelve a barrer la cuenta cuando entra saldo.</div>
  <div class="tw"><table><thead><tr><th>Fecha</th><th style="text-align:left">Diligencia</th><th>Importe</th></tr></thead><tbody>${
    d.embargos.map(e=>`<tr><td style="font-family:'IBM Plex Mono',monospace">${fecha(e.fecha)}</td>
      <td style="text-align:left;font-family:'IBM Plex Mono',monospace">${esc(e.diligencia)}</td><td>${eur(e.importe)}</td></tr>`).join("")
  }</tbody></table></div></div>`;
}

function extinguidas(d){
  if(!d.extinguidas || !d.extinguidas.length) return "";
  return `<h2>Ya no se deben</h2><div class="card"><div class="nota">Constaban en providencias de apremio guardadas en Descargas, pero no figuran en la relación de deudas de la sede. No volver a contarlas.</div>
  <div class="tw"><table><thead><tr><th>Concepto</th><th style="text-align:left">Clave</th><th>Importe</th><th style="text-align:left">Comprobado</th></tr></thead><tbody>${
    d.extinguidas.map(e=>`<tr><td>${esc(e.concepto)}</td>
      <td style="text-align:left;font-family:'IBM Plex Mono',monospace">${esc(e.referencia)}</td>
      <td class="muted">${eur(e.importe)}</td>
      <td style="text-align:left;font-size:12px;color:var(--ink-3)">${esc(e.comprobado)}</td></tr>`).join("")
  }</tbody></table></div></div>`;
}

function pinta(d){
  const app = document.getElementById("app");
  if(!d.ok){ app.innerHTML = `<div class="err">No se pudo cargar: ${esc(d.error||"error desconocido")}</div>`; return; }
  document.getElementById("sello").textContent =
    "Calendario al " + fecha(d.calendario_actualizado) + " · cruzado con " + d.cruce.apuntes_banco + " apuntes de banco";
  app.innerHTML = kpis(d) + avisos(d) + proximos(d)
    + `<h2>Expedientes</h2>` + d.expedientes.map(expediente).join("")
    + periodicos(d) + recurrentes(d) + embargos(d) + extinguidas(d)
    + `<div class="metodo"><strong>Cómo leerlo.</strong> ${esc(d.nota_metodo)} El calendario se mantiene a mano en <code>ara-os-obligaciones.cjs</code>: cuando llegue un acuerdo o una notificación nueva, hay que añadirla ahí. Fuente: ${esc(d.fuente)}.</div>`;
}

async function cargar(force){
  try{
    const r = await fetch("/api/ara-os/obligaciones?token=" + encodeURIComponent(TOKEN) + (force?"&force=1":""));
    pinta(await r.json());
  }catch(e){
    document.getElementById("app").innerHTML = `<div class="err">No se pudo conectar: ${esc(e.message)}</div>`;
  }
}
document.getElementById("recargar").addEventListener("click", ()=>cargar(true));
cargar(false);
</script>
</body>
</html>
